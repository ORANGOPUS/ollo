name: Pages · deploy

# Builds the read-only site from main and deploys it with GitHub Pages
# (Settings → Pages → Source: GitHub Actions). Each deploy replaces the whole
# site, so deleted profiles disappear from it; they remain in main's git
# history (see the privacy notice).
on:
  push:
    branches: [main]
    paths:
      - 'profiles/**'
      - 'pages-site/**'
      - 'app.config.ts'
      - '.github/workflows/pages-*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node pages-site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
